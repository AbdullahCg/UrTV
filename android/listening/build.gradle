plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.urtv.listening'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.urtv.listening'
        minSdk 21
        targetSdk 34
        // CI passes its run number so every build installs over the previous one
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // the key lives only in the repository's secrets (made with .github/tools/make_signing_key.py) and CI refuses
        // to build without it; a local build without ANDROID_KEYSTORE gets the debug key, so it can't update the TV's apps
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'urtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    // Thmanyah is shared with the launcher, not copied again
    sourceSets {
        main { assets.srcDirs = ['src/main/assets', '../launcher/src/main/assets'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
