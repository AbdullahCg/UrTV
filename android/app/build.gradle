plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.urtv.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.urtv.screensaver'
        minSdk 21
        targetSdk 34
        // CI passes its run number so every build installs over the previous one; 3.x since the new signing key,
        // the same number as the home app and as the release (v3.N)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "3.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // one fixed key so new builds install over old ones on the TV
        release {
            // CI signs with the key in the repository's secrets (ANDROID_KEYSTORE_B64, see .github/tools/make_signing_key.py);
            // until those are set, with the old key that is public in this repo, so builds keep working
            def secret = System.getenv('ANDROID_KEYSTORE')
            storeFile file(secret ?: '../tvsaver.keystore')
            storePassword secret ? System.getenv('ANDROID_KEYSTORE_PASSWORD') : 'tvsaver'
            keyAlias secret ? 'urtv' : 'tvsaver'
            keyPassword secret ? System.getenv('ANDROID_KEYSTORE_PASSWORD') : 'tvsaver'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // the page is built by ../../src/build.py into dist/
    sourceSets {
        main { assets.srcDirs = ['../../dist', '../../assets/shared', '../launcher/src/main/assets', '../../assets'] }   // page, teams-ar.json, Thmanyah fonts, backgrounds/
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
