plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.yourtv.screensaver'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.yourtv.screensaver'
        minSdk 21
        targetSdk 34
        // CI passes its run number so every build installs over the previous one
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "2.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // one fixed key so new builds install over old ones on the TV
        release {
            storeFile file('../tvsaver.keystore')
            storePassword 'tvsaver'
            keyAlias 'tvsaver'
            keyPassword 'tvsaver'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // the page is built by ../../build.py into dist/
    sourceSets {
        main { assets.srcDirs = ['../../dist', '../../assets/shared', '../launcher/src/main/assets', '../../assets'] }   // page, teams-ar.json, Thmanyah fonts, backgrounds/
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
