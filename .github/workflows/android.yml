name: Build APKs

on:
  push:
    branches: [master]
    paths: ['src/**', 'assets/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # the signing key lives only in the repository's secrets (made once with .github/tools/make_signing_key.py)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret yet: signed with the old key that is public in this repo"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            urtv-screensaver.apk
            urtv-home.apk

      # fixed download links: .../releases/download/apk-latest/urtv-screensaver.apk and urtv-home.apk
      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APKs
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
          files: |
            urtv-screensaver.apk
            urtv-home.apk
          make_latest: true
