name: Build APKs

on:
  push:
    branches: [master]
    paths: ['src/**', 'assets/**', 'build.py', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the page
        run: python3 build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tvsaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk tvhome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            tvsaver.apk
            tvhome.apk

      # fixed download links: .../releases/download/apk-latest/tvsaver.apk and tvhome.apk
      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APKs
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
          files: |
            tvsaver.apk
            tvhome.apk
          make_latest: true
