name: Clubs and their ids

# TheSportsDB is unreachable from the dev container; CI lists every club of the app's
# leagues and the national teams, with their ids, in the data-team-ids branch for review.
# Monthly too, for promoted and renamed clubs.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [master, next]
    paths: ['.github/tools/team_ids.py', 'android/app/src/main/java/sa/urtv/screensaver/Prefs.java']

permissions:
  contents: write

jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/team_ids.py
      - name: Push to data-team-ids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-team-ids
          git rm -rfq --cached .
          git add teams
          git commit -qm "Clubs and national teams with their TheSportsDB ids"
          git push -f origin data-team-ids
