name: Club ids from the leagues' matches

# TheSportsDB is unreachable from the dev container; CI finds the Saudi clubs'
# ids in their leagues' matches and pushes them to the data-team-ids branch for review.
on:
  workflow_dispatch:
  push:
    branches: [master, next]
    paths: ['.github/tools/team_ids.py']

permissions:
  contents: write

jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/team_ids.py
      - name: Push to data-team-ids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-team-ids
          git rm -rfq --cached .
          git add teams
          git commit -qm "Saudi clubs' TheSportsDB ids from their matches"
          git push -f origin data-team-ids
