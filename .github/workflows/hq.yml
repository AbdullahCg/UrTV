name: Fetch HQ backgrounds

# Commons is unreachable from the dev container: CI downloads the picks at 3840 px
# and pushes them to the bg-hq branch for cropping.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/tools/fetch_hq.py', '.github/tools/hq-picks.json']

permissions:
  contents: write

jobs:
  hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/fetch_hq.py
      - name: Push to bg-hq
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan bg-hq
          git rm -rfq --cached .
          git add hq
          git commit -qm "HQ background picks"
          git push -f origin bg-hq
